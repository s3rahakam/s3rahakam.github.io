name: تحديث الأسعار

on:
  schedule:
    - cron: "17 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:          # زرار "Run workflow" عشان تشغله بإيدك

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تسطيب المكتبات
        run: pip install curl_cffi

      - name: سحب الأسعار
        run: python scraper/update_prices.py

      - name: حفظ الأسعار الجديدة
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "مفيش تغيير"
          else
            git commit -m "تحديث الأسعار"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: إعادة نشر الموقع
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
